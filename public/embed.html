<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>チャット埋め込み用（body以下をコピー）</title>
</head>
<body>
<!--
  外部サイトに貼り付ける用（このコメントブロックは貼り付け先で削除してOK）
  置換タグ（配信時にユーザーごとに置き換える）:
  [[UID]]     … ログインID（ユーザー識別子）
  [[UNAME]]   … 表示名（ニックネーム）
  [[UADDRESS]]… メールアドレス（通知送信先）
  [[UPASS]]   … パスワード（通知メールに表示・ログイン用。未設定ならURLに ?upass=xxx を付与しても可）
  [[UPHOTO]]  … キャラクター画像のURL（チャット上部に表示）
  ※置換しない場合はそのまま [[UID]] 等の文字列が残り、ID/メール/パスワードは使われません。
-->
<!-- ========== ここから下を外部サイトのフリーページに貼り付ける ========== -->

<style>
#ai-chat-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
.ai-chat-wrap { max-width: 420px; margin: 0 auto; height: 100%; min-height: 500px; display: flex; flex-direction: column; background: #e5ddd5; box-shadow: 0 0 12px rgba(0,0,0,0.15); }
.ai-chat-header { background: #07c755; color: #fff; padding: 14px 16px; font-size: 17px; font-weight: 600; flex-shrink: 0; }
.ai-chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.ai-chat-msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.ai-chat-msg.assistant { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.ai-chat-msg.user { align-self: flex-end; background: #95ec69; color: #333; border-bottom-right-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
/* 入力エリア: PCで折り返し・スマホで縦に自動伸長。送信ボタンは下揃え */
.ai-chat-input-wrap { padding: 10px 12px; background: #f7f7f7; flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
.ai-chat-input { flex: 1; min-width: 0; min-height: 48px; max-height: 120px; padding: 12px 16px; border: none; border-radius: 24px; font-size: 16px; line-height: 1.5; background: #fff; -webkit-appearance: none; appearance: none; resize: none; overflow-y: auto; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; box-sizing: border-box; }
.ai-chat-send { width: 48px; height: 48px; min-width: 48px; border: none; border-radius: 50%; background: #07c755; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ai-chat-send:disabled { opacity: 0.6; cursor: not-allowed; }
.ai-chat-warn { padding: 8px 12px; font-size: 13px; color: #c00; }
.ai-chat-dbg { padding: 6px 12px; font-size: 11px; color: #666; }
.ai-chat-bookmark { background: #fff; padding: 12px 14px; margin: 0 12px 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 13px; }
.ai-chat-bookmark-title { font-weight: 600; margin-bottom: 8px; color: #333; }
.ai-chat-bookmark-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ai-chat-bookmark-btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; background: #07c755; color: #fff; }
.ai-chat-bookmark-btn.outline { background: transparent; border: 1px solid #07c755; color: #07c755; }
.ai-chat-bookmark-close { position: absolute; top: 8px; right: 8px; background: none; border: none; font-size: 18px; cursor: pointer; color: #999; padding: 0; line-height: 1; }
.ai-chat-bookmark-wrap { position: relative; padding-right: 28px; }
.ai-chat-bookmark-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
.ai-chat-bookmark-detail summary { cursor: pointer; }
.ai-chat-bookmark-link { padding: 6px 12px; font-size: 12px; color: #07c755; cursor: pointer; text-decoration: underline; flex-shrink: 0; }
.ai-chat-bookmark-link:hover { opacity: 0.8; }
.ai-chat-photo { width: 100%; max-height: 160px; object-fit: cover; object-position: center top; flex-shrink: 0; display: block; }
/* 相手入力中インジケータ（三点バウンス） */
.ai-chat-typing-wrap { align-self: flex-start; }
.ai-chat-typing-dots { display: inline-flex; gap: 2px; padding: 4px 0; }
.ai-chat-typing-dots span { animation: ai-chat-typing-bounce 0.6s ease-in-out infinite both; }
.ai-chat-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.ai-chat-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes ai-chat-typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
@media (min-width: 421px) { .ai-chat-wrap { min-height: 600px; height: 600px; } }
</style>

<div id="ai-chat-root"></div>

<script>
(function () {

  function safeUUID() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) {}
    return "u-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  const API_URL = "https://worker.mituo0226.workers.dev/api/chat";

  const externalUid = ("[[UID]]" || "").toString().trim();
  const externalUname = ("[[UNAME]]" || "").toString().trim();
  const externalUaddress = ("[[UADDRESS]]" || "").toString().trim();
  const externalUpass = ("[[UPASS]]" || "").toString().trim();
  const externalUphoto = ("[[UPHOTO]]" || "").toString().trim();

  const hasExternalUid = externalUid && !externalUid.includes("[[");
  const hasExternalUname = externalUname && !externalUname.includes("[[");
  const hasExternalUaddress = externalUaddress && !externalUaddress.includes("[[");
  const hasExternalUpass = externalUpass && !externalUpass.includes("[[");
  const hasExternalUphoto = externalUphoto && !externalUphoto.includes("[[") && /^https?:\/\//i.test(externalUphoto);

  const email = hasExternalUaddress ? externalUaddress : "";

  function getUserIdFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("userId") || "";
    } catch (e) {
      return "";
    }
  }
  function getUpassFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      return (params.get("upass") || "").trim();
    } catch (e) {
      return "";
    }
  }

  const urlUserId = getUserIdFromUrl();
  const urlUpass = getUpassFromUrl();
  let userId = "";
  try {
    userId = urlUserId
      ? urlUserId
      : (hasExternalUid
        ? externalUid
        : (localStorage.getItem("ai_user_id") || safeUUID()));
    if (userId) localStorage.setItem("ai_user_id", userId);
  } catch (e) {
    userId = urlUserId || (hasExternalUid ? externalUid : safeUUID());
  }

  const nickname = (
    hasExternalUname ? externalUname : (window.CURRENT_USERNAME || "")
  ).toString().trim();

  const root = document.getElementById("ai-chat-root");
  if (!root) return;

  var isSameOrigin = false;
  try {
    isSameOrigin = (new URL(API_URL)).origin === window.location.origin;
  } catch (e) {}
  if (isSameOrigin) {
    var m = document.createElement("link");
    m.rel = "manifest";
    m.href = "/manifest.webmanifest";
    document.head.appendChild(m);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    }
  }

  const TTL_MS = 3 * 24 * 60 * 60 * 1000;
  function shouldShowGuide() {
    try {
      const dismissedAt = Number(localStorage.getItem("bookmarkGuideDismissedAt") || "0");
      if (!dismissedAt) return true;
      return (Date.now() - dismissedAt) > TTL_MS;
    } catch (e) {
      return true;
    }
  }
  function markGuideDismissed() {
    try {
      localStorage.setItem("bookmarkGuideDismissedAt", String(Date.now()));
    } catch (e) {}
  }
  const dismissBookmarkGuide = () => {
    markGuideDismissed();
    const el = document.getElementById("bookmark-guide");
    if (el) el.style.display = "none";
  };

  function escapeAttr(s) {
    if (!s || typeof s !== "string") return "";
    return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  const photoHtml = hasExternalUphoto
    ? "<img class=\"ai-chat-photo\" src=\"" + escapeAttr(externalUphoto) + "\" alt=\"\" />"
    : "";

  root.innerHTML = `
    <div class="ai-chat-wrap">
      ` + photoHtml + `
      <div class="ai-chat-header">佐藤淳也</div>
      <div id="bookmark-link" class="ai-chat-bookmark-link">ブックマークしてない人はこちら</div>
      <div id="bookmark-guide" class="ai-chat-bookmark" style="display:none;">
        <div class="ai-chat-bookmark-wrap">
          <button class="ai-chat-bookmark-close" id="bookmark-guide-close" aria-label="閉じる">×</button>
          <div class="ai-chat-bookmark-title">📌 チャットをいつでも開けるように</div>
          <p style="margin:0 0 8px;">ブックマークまたはホーム画面に追加すると便利です。</p>
          <div class="ai-chat-bookmark-btns">
            <button id="btn-copy-url" class="ai-chat-bookmark-btn">URLをコピー</button>
            <button id="btn-share" class="ai-chat-bookmark-btn outline" style="display:none;">共有する</button>
            <button id="btn-pwa-install" class="ai-chat-bookmark-btn" style="display:none;">アプリとして追加（インストール）</button>
            <button id="btn-ios-a2hs" class="ai-chat-bookmark-btn outline">iPhoneの追加手順を見る</button>
          </div>
          <details class="ai-chat-bookmark-detail">
            <summary>各デバイスでの追加方法</summary>
            <p style="margin:8px 0 4px;"><strong>iPhone</strong>: Safariで共有ボタン → 「ホーム画面に追加」</p>
            <p style="margin:4px 0 4px;"><strong>Android</strong>: Chromeでメニュー(︙) → 「ホーム画面に追加」または「アプリをインストール」</p>
            <p style="margin:4px 0 0;"><strong>PC</strong>: アドレスバーの☆をクリック、または Ctrl+D (Mac: Cmd+D)</p>
          </details>
        </div>
      </div>
      <div id="log" class="ai-chat-log"></div>
      <div id="warn" class="ai-chat-warn" style="display:none;"></div>
      <div class="ai-chat-input-wrap">
        <textarea id="msg" class="ai-chat-input" rows="1" placeholder="メッセージ" enterkeyhint="send"></textarea>
        <button id="send" class="ai-chat-send" aria-label="送信">➤</button>
      </div>
      <div id="dbg" class="ai-chat-dbg" aria-hidden="true"></div>
    </div>
  `;

  const logEl = document.getElementById("log");
  const msgEl = document.getElementById("msg");
  const sendEl = document.getElementById("send");
  const warnEl = document.getElementById("warn");
  const dbgEl = document.getElementById("dbg");

  /** 入力欄の高さを内容に合わせて伸縮（スマホで縦に広がる）。最小48px・最大120px。 */
  function resizeMsgInput() {
    msgEl.style.height = "0px";
    msgEl.style.height = Math.max(48, Math.min(msgEl.scrollHeight, 120)) + "px";
  }
  /** 送信後などで入力欄を空にしたときに高さを1行に戻す */
  function resetMsgInputHeight() {
    msgEl.style.height = "0px";
    msgEl.style.height = Math.max(48, Math.min(msgEl.scrollHeight || 48, 120)) + "px";
  }
  msgEl.addEventListener("input", resizeMsgInput);

  let history = [];

  /** チャットログに1件追加（user / assistant）して最下部へスクロール */
  function addLine(role, text) {
    const div = document.createElement("div");
    div.className = "ai-chat-msg " + role;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    history.push({ role, content: text });
  }

  /** 相手入力中インジケータ（三点バウンス）を表示 */
  function showTyping() {
    const wrap = document.createElement("div");
    wrap.id = "typing-indicator";
    wrap.className = "ai-chat-msg assistant ai-chat-typing-wrap";
    wrap.innerHTML = '<span class="ai-chat-typing-dots"><span>.</span><span>.</span><span>.</span></span>';
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
  }
  /** 相手入力中インジケータを非表示にする */
  function hideTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  /** 警告メッセージを表示／非表示 */
  function showWarn(msg) {
    warnEl.textContent = msg;
    warnEl.style.display = msg ? "block" : "none";
  }

  /** タイピング表示を少なくとも1フレーム描画してからAPIを呼ぶ（応答が速くても「...」アニメが見えるようにする） */
  function afterTypingPaint() {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(resolve);
      });
    });
  }

  /** タイピング表示の最低表示時間（ms）が経過するまで待つ。経過済みなら即 resolve。 */
  function waitRemainingTypingMin(shownAt, minMs) {
    const elapsed = Date.now() - shownAt;
    const remaining = minMs - elapsed;
    if (remaining <= 0) return Promise.resolve();
    return new Promise(function (r) { setTimeout(r, remaining); });
  }

  /** メッセージ送信: ユーザー発言をログに追加 → タイピング表示 → API呼び出し → 返信を追加 */
  async function send() {
    const text = (msgEl.value || "").trim();
    if (!text) return;

    showWarn("");
    addLine("user", text);
    msgEl.value = "";
    resetMsgInputHeight();
    sendEl.disabled = true;
    showTyping();
    await afterTypingPaint();

    const typingShownAt = Date.now();
    const TYPING_MIN_MS = 400; /* タイピング表示の最低表示時間（応答が速くてもアニメを見せる） */

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({
          userId: userId,
          nickname: nickname,
          email: email,
          message: text,
          chatUrl: window.location.href,
          password: (hasExternalUpass ? externalUpass : "") || urlUpass || ""
        })
      });

      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch {}

      if (!res.ok) {
        await waitRemainingTypingMin(typingShownAt, TYPING_MIN_MS);
        hideTyping();
        showWarn("APIエラー: " + res.status + " " + raw.slice(0, 200));
        addLine("assistant", "サーバー側でエラーが出たみたい。少し待ってもう一度送ってみて");
        return;
      }

      await waitRemainingTypingMin(typingShownAt, TYPING_MIN_MS);
      hideTyping();
      addLine(
        "assistant",
        (data && data.reply)
          ? data.reply
          : "ごめん、今ちょっと途切れた…。もう一回言って？"
      );

    } catch (e) {
      await waitRemainingTypingMin(typingShownAt, TYPING_MIN_MS);
      hideTyping();
      showWarn("通信エラー: " + String(e));
      addLine("assistant", "通信エラーが出たみたい。しばらくしてからもう一度送ってみて");
    } finally {
      sendEl.disabled = false;
      msgEl.focus();
    }
  }

  sendEl.addEventListener("click", send);
  msgEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  (async function showGreeting() {
    const GREETING_URL = API_URL.replace("/chat", "/chat/greeting");
    try {
      const res = await fetch(GREETING_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({ userId, nickname, email })
      });
      const data = await res.json().catch(() => ({}));
      addLine("assistant", (data && data.greeting) || "これからはこのチャットで話そうね、返信してみてくれないかなよろしく");
    } catch {
      addLine("assistant", "これからはこのチャットで話そうね、返信してみてくれないかなよろしく");
    }
  })();

  if (shouldShowGuide()) {
    document.getElementById("bookmark-guide").style.display = "block";
  }
  document.getElementById("bookmark-link").addEventListener("click", function () {
    document.getElementById("bookmark-guide").style.display = "block";
  });
  document.getElementById("bookmark-guide-close").addEventListener("click", dismissBookmarkGuide);
  document.getElementById("btn-copy-url").addEventListener("click", function () {
    const url = window.location.href;
    const btn = this;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        btn.textContent = "コピーしました";
        setTimeout(function () { btn.textContent = "URLをコピー"; }, 2000);
      }).catch(function () { fallbackCopy(url, btn); });
    } else {
      fallbackCopy(url, btn);
    }
  });
  function fallbackCopy(url, btn) {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      btn.textContent = "コピーしました";
      setTimeout(function () { btn.textContent = "URLをコピー"; }, 2000);
    } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.share) {
    document.getElementById("btn-share").style.display = "inline-block";
    document.getElementById("btn-share").addEventListener("click", function () {
      navigator.share({ url: window.location.href, title: "チャット", text: "チャットへのリンク" }).catch(function () {});
    });
  }

  function isIOS() {
    const ua = navigator.userAgent || "";
    const iOS = /iPhone|iPad|iPod/.test(ua);
    const iPadOS = ua.includes("Macintosh") && navigator.maxTouchPoints > 1;
    return iOS || iPadOS;
  }
  function isSafari() {
    const ua = navigator.userAgent || "";
    const isAppleWebKit = /AppleWebKit/.test(ua);
    const isChrome = /CriOS|Chrome/.test(ua);
    const isFirefox = /FxiOS|Firefox/.test(ua);
    return isAppleWebKit && !isChrome && !isFirefox;
  }
  function showIOSA2HSModal() {
    if (document.getElementById("ios-a2hs-modal")) return;
    const bg = document.createElement("div");
    bg.id = "ios-a2hs-modal";
    bg.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:flex;justify-content:center;align-items:flex-end;";
    const panel = document.createElement("div");
    panel.style.cssText = "width:100%;max-width:520px;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px 18px;font-size:14px;line-height:1.6;";
    const close = document.createElement("button");
    close.textContent = "×";
    close.setAttribute("aria-label", "閉じる");
    close.style.cssText = "float:right;border:none;background:transparent;font-size:22px;cursor:pointer;";
    close.addEventListener("click", function () { bg.remove(); });
    const title = document.createElement("div");
    title.style.cssText = "font-weight:700;margin-bottom:8px;font-size:16px;";
    title.textContent = "iPhoneでホーム画面に追加する手順";
    const ol = document.createElement("ol");
    ol.style.cssText = "margin:0;padding-left:18px;";
    ol.innerHTML = "<li>画面下の「共有」（四角＋↑）を押します</li><li>「ホーム画面に追加」を選びます</li><li>右上の「追加」を押して完了です</li>";
    const note = document.createElement("div");
    note.style.cssText = "opacity:.75;font-size:12px;margin-top:8px;";
    note.textContent = "※Safari以外では表示が異なる場合があります。";
    panel.appendChild(close);
    panel.appendChild(title);
    panel.appendChild(ol);
    panel.appendChild(note);
    bg.appendChild(panel);
    bg.addEventListener("click", function (e) { if (e.target === bg) bg.remove(); });
    document.body.appendChild(bg);
  }

  var deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    var btn = document.getElementById("btn-pwa-install");
    if (btn) btn.style.display = "inline-flex";
  });
  window.addEventListener("appinstalled", function () {
    deferredInstallPrompt = null;
    var btn = document.getElementById("btn-pwa-install");
    if (btn) btn.style.display = "none";
  });

  var iosHelpBtn = document.getElementById("btn-ios-a2hs");
  if (iosHelpBtn) {
    iosHelpBtn.addEventListener("click", function () {
      if (isIOS() && isSafari()) {
        showIOSA2HSModal();
      } else {
        var details = document.querySelector("#bookmark-guide details");
        if (details) details.open = true;
      }
    });
  }

  var installBtn = document.getElementById("btn-pwa-install");
  if (installBtn) {
    installBtn.addEventListener("click", function () {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      var self = installBtn;
      deferredInstallPrompt.userChoice.then(function () {
        deferredInstallPrompt = null;
        self.style.display = "none";
      }).catch(function () {
        deferredInstallPrompt = null;
        self.style.display = "none";
      });
    });
  }

  // 外部サイト貼り付け時は認証情報を表示しない（同一オリジンかつ ?debug=1 のときのみ簡易表示）
  var showDebug = false;
  try {
    var urlParams = new URLSearchParams(window.location.search);
    showDebug = (new URL(API_URL)).origin === window.location.origin && urlParams.get("debug") === "1";
  } catch (e) {}
  if (showDebug) {
    dbgEl.textContent = "debug: script ok / API=" + API_URL + " / userId=" + (userId ? userId.slice(0, 6) + "…" : "(none)");
  } else {
    dbgEl.style.display = "none";
  }

})();
</script>

<!-- ========== ここまで ========== -->
</body>
</html>
